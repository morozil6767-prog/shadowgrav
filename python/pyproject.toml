[project]
name = "shadowgrav"
version = "0.1.0"
description = "Python interface to the shadowgrav-core engine (classical non-additive shadow-gravity N-body model) via the sgrun command"
requires-python = ">=3.8"
dependencies = []
[project.optional-dependencies]
numpy = ["numpy"]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["shadowgrav"]
